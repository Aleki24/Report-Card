name: Mobile update

# Publishes the phone app over the air (EAS Update) to the preview and
# production apps, so installed apps get changes without a new APK. Run it
# by hand for now: Actions → Mobile update → Run workflow. To publish on
# every merge instead, add back a `push` trigger on main for 'mobile/**',
# 'src/lib/**' and 'src/types/**' (the app imports the last two as
# `@shared/*`). Native changes still need a new build: the fingerprint
# runtime policy (app.json) keeps an update off any build it would not run on.

on:
  workflow_dispatch:

# One publish at a time, in order; a second run waits rather than racing.
concurrency:
  group: mobile-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require the Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens) so app updates can be published."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # A broken update would reach every phone, so it must at least compile.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Publish to the preview and production apps
        run: |
          message="$(git log -1 --pretty=%s)"
          for channel in preview production; do
            eas update --channel "$channel" --environment "$channel" --message "$message" --non-interactive
          done
