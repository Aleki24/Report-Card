name: Mobile build

# Builds the phone app on Expo (EAS Build) for the Google Play Store: an
# Android App Bundle (.aab) from the production profile, signed with the
# app's Expo-managed key. Run it by hand: Actions → Mobile build → Run
# workflow. With "Submit to Google Play" ticked, the finished build is
# uploaded to Google Play's internal testing track (Expo Submit's default),
# which needs a Google service account key assigned to the app on Expo.
# Submit settings stay out of eas.json on purpose: eas.json is part of the
# app's runtime fingerprint, and changing it would stop "Mobile update"
# reaching the builds already installed.
# Day-to-day changes go out with "Mobile update" instead; a new build is
# only needed for the store or a native change.

on:
  workflow_dispatch:
    inputs:
      submit:
        description: Submit to Google Play (internal testing)
        type: boolean
        default: false

concurrency:
  group: mobile-build
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require the Expo token
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # A broken build costs a build slot and a wait, so it must at least compile.
      - name: Typecheck
        run: npx tsc --noEmit

      # Queued on Expo; the link to follow it is printed below and on expo.dev.
      - name: Build for Google Play
        run: |
          if [ "${{ inputs.submit }}" = "true" ]; then
            eas build --platform android --profile production --non-interactive --no-wait --auto-submit
          else
            eas build --platform android --profile production --non-interactive --no-wait
          fi
